<nav class="mt-5 space-y-6">

  <!-- MENU -->
  <div>

    <h2 class="px-3 text-xs font-semibold uppercase text-gray-400 mb-3">
      MENU
    </h2>

    <ul class="space-y-2 mx-4">
      @for (nav of filteredMenu; track $index; let i = $index) {
      <li>

        <!-- ITEM CON SUBMENU -->
        @if (nav.subItems) {
        <details class="group">

          <!-- PARENT -->
          <summary class="flex items-center justify-between px-3 py-2 rounded-lg cursor-pointer
                   hover:bg-gray-100 transition" [ngClass]="{
                'bg-blue-100 text-blue-600': isParentActive(nav),
                'text-gray-700': !isParentActive(nav)
              }">

            <div class="flex items-center gap-3">

              <!-- ICON -->
              <i [class]="nav.icon" class="transition-colors" [ngClass]="{
                  'text-blue-600': isParentActive(nav),
                  'text-gray-500': !isParentActive(nav)
                }"></i>

              <span class="font-medium" [ngClass]="{
                  'text-blue-600': isParentActive(nav)
                }">
                {{ nav.name }}
              </span>

            </div>

            <!-- arrow -->
            <i class="fa-solid fa-chevron-down text-xs transition group-open:rotate-180"></i>

          </summary>

          <!-- SUBMENU -->
          <ul class="mt-3 ml-6 pl-4 space-y-1 border-l border-gray-200">

            @for (sub of nav.subItems; track $index) {

            <li>

              <a [routerLink]="sub.path" routerLinkActive="menu-active" class="block px-3 py-2 rounded-md
               text-gray-600 hover:bg-gray-100 transition">

                {{ sub.name }}

              </a>

            </li>

            }

          </ul>

        </details>

        }

        <!-- ITEM NORMAL -->
        @else {

        <a [routerLink]="nav.path" routerLinkActive="menu-active" class="flex items-center gap-3 px-3 py-2 rounded-lg
                 text-gray-700 hover:bg-gray-100 transition">

          <!-- ICON -->
          <i [class]="nav.icon" class="transition-colors" [ngClass]="{
              'text-blue-600': isActive(nav.path),
              'text-gray-500': !isActive(nav.path)
            }"></i>

          <span class="font-medium" [ngClass]="{
              'text-blue-600': isActive(nav.path)
            }">
            {{ nav.name }}
          </span>

        </a>

        }

      </li>

      }

    </ul>

  </div>

</nav>
