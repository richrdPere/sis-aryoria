<div class="p-6 min-h-full bg-base-200 text-base-content overflow-auto transition-colors duration-300">
  <!-- Titulo -->
  <h1 class="text-2xl font-bold mb-5 text-base-content ">Gestion de Ingresos</h1>

  <!-- Header -->
  <div class="p-4 mb-7 card bg-base-100 shadow-md">

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 py-4">

      <!--  BUSCADOR -->
      <div class="flex flex-col md:flex-row gap-4 items-center w-full md:w-auto">

        <!-- Input buscar -->
        <div class="relative w-full md:max-w-xs">
          <input type="text" class="input input-bordered w-full bg-base-100 rounded-md h-11 pl-10 pr-4 text-sm
                 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Buscar por N° Expediente"
            autocomplete="off" [(ngModel)]="nombreBusqueda" (ngModelChange)="onSearchChange()" />
          <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        </div>


        <!-- Filtro MES -->
        <select class="select select-bordered h-11 bg-base-100 text-base-content w-full md:w-40" [(ngModel)]="filtroMes"
          (change)="aplicarFiltros()">

          <option value="">Mes</option>
          <option *ngFor="let mes of meses" [value]="mes.value">
            {{ mes.label }}
          </option>
        </select>

        <!-- Filtro AÑO -->
        <select class="select select-bordered h-11 bg-base-100 text-base-content w-full md:w-32"
          [(ngModel)]="filtroAnio" (change)="aplicarFiltros()">

          <option value="">Año</option>
          <option *ngFor="let anio of anios" [value]="anio">
            {{ anio }}
          </option>
        </select>

      </div>
    </div>

  </div>
</div>
